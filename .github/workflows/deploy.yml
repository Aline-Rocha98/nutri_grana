name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verificar secrets de produção
        id: verificar_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          faltando=()
          [ -z "${VPS_HOST:-}" ] && faltando+=("VPS_HOST")
          [ -z "${VPS_USER:-}" ] && faltando+=("VPS_USER")
          [ -z "${VPS_SSH_KEY:-}" ] && faltando+=("VPS_SSH_KEY")
          [ -z "${VPS_PORT:-}" ] && faltando+=("VPS_PORT")
          [ -z "${DEPLOY_PATH:-}" ] && faltando+=("DEPLOY_PATH")

          if [ "${#faltando[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy ignorado: secrets de produção ainda não configurados (${faltando[*]}). Configure-os no environment production quando a VPS estiver pronta."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        if: steps.verificar_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            bash scripts/deploy.sh
